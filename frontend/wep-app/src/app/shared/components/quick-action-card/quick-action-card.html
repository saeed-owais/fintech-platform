<a [routerLink]="route()"
    class="block p-6 rounded-2xl border transition-all duration-300 hover:scale-105 hover:shadow-xl cursor-pointer"
    [class]="color() === 'green' 
     ? 'bg-emerald-500/10 border-emerald-500/20 hover:border-emerald-500/40' 
     : color() === 'red' 
       ? 'bg-red-500/10 border-red-500/20 hover:border-red-500/40'
       : 'bg-blue-500/10 border-blue-500/20 hover:border-blue-500/40'">

    <!-- Icon -->
    <div class="mb-4">
        @switch (icon()) {
        @case ('deposit') {
        <div class="w-12 h-12 rounded-xl bg-emerald-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </div>
        }
        @case ('withdraw') {
        <div class="w-12 h-12 rounded-xl bg-red-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
            </svg>
        </div>
        }
        @case ('transfer') {
        <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
        </div>
        }
        }
    </div>

    <!-- Title -->
    <h3 class="text-lg font-semibold text-white mb-1">{{ title() }}</h3>

    <!-- Arrow -->
    <div class="flex items-center text-slate-400">
        <span class="text-sm">Click to proceed</span>
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
    </div>
</a>
